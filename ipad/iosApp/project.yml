# Xcode-projektet för Tv för iPad. GitHub gör om det här till ett riktigt
# Xcode-projekt med XcodeGen vid varje bygge, så projektfilen behöver inte
# ligga i repot.
name: TvApp
options:
  bundleIdPrefix: se.norrsken.tv
  deploymentTarget:
    iOS: "16.0"
targets:
  TvApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TvApp
    dependencies:
      # Kotlin-delen, byggd av Gradle före Xcode.
      - framework: ../build/bin/iosArm64/releaseFramework/TvKit.framework
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tv
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_NAME: TvApp
        PRODUCT_BUNDLE_IDENTIFIER: se.norrsken.tv.ipad
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/bin/iosArm64/releaseFramework"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
