name: Build iPad

# Tv för iPad. Byggs på en Mac hos GitHub och läggs under Releases som
# "Tv för iPad", med en fast länk till Tv-iPad.ipa. Appen är osignerad:
# AltStore signerar den med ditt Apple-ID när den installeras.
on:
  push:
    branches: [ main ]
    paths:
      - 'ipad/**'
      - 'windows/src/main/kotlin/se/norrsken/tv/desktop/ui/Theme.kt'
      - 'windows/src/main/kotlin/se/norrsken/tv/desktop/ui/Decorations.kt'
      - 'windows/src/main/kotlin/se/norrsken/tv/desktop/ui/Glyphs.kt'
      - 'windows/src/main/kotlin/se/norrsken/tv/desktop/ui/Components.kt'
      - '.github/workflows/ipad.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # Kotlin-delen: hela appen, som ett ramverk Xcode kan bygga in.
      - name: Bygg Kotlin-delen
        id: kotlin
        working-directory: ipad
        run: |
          set -o pipefail
          status=0
          gradle linkReleaseFrameworkIosArm64 --stacktrace 2>&1 | tee build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Sammanfatta felet i Kotlin-delen
        if: steps.kotlin.outputs.status != '0'
        working-directory: ipad
        run: |
          KOTLIN=$(grep -E '^e: ' build.log | head -n 40)
          WHAT=$(sed -n '/\* What went wrong:/,/\* Try:/p' build.log | head -n 25)
          {
            echo '## iPad-bygget misslyckades (Kotlin)'
            echo ''
            echo 'Kopiera allt i rutan nedan och klistra in det i chatten.'
            echo ''
            echo '```'
            if [ -n "$KOTLIN" ]; then printf '%s\n' "$KOTLIN"; fi
            if [ -n "$WHAT" ]; then printf '%s\n' "$WHAT"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Själva iPad-appen: Xcode-projektet skapas av XcodeGen och byggs osignerat.
      - name: Bygg iPad-appen
        id: app
        working-directory: ipad/iosApp
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          status=0
          xcodebuild -project TvApp.xcodeproj -target TvApp -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee xcode.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Sammanfatta felet i Xcode
        if: steps.app.outputs.status != '0'
        working-directory: ipad/iosApp
        run: |
          ERR=$(grep -E 'error:|Undefined symbol|ld: ' xcode.log | head -n 40)
          {
            echo '## iPad-bygget misslyckades (Xcode)'
            echo ''
            echo 'Kopiera allt i rutan nedan och klistra in det i chatten.'
            echo ''
            echo '```'
            printf '%s\n' "$ERR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # En .ipa är bara appen i en mapp som heter Payload, packad som zip.
      - name: Packa Tv-iPad.ipa
        run: |
          mkdir -p dist/Payload
          cp -R ipad/iosApp/build/Release-iphoneos/TvApp.app dist/Payload/
          cd dist
          zip -qr Tv-iPad.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v6
        with:
          name: tv-ipad
          path: dist/Tv-iPad.ipa
          if-no-files-found: error
          retention-days: 30

      # En enda release, "ipad-senaste", som byts ut vid varje bygge.
      - name: Publicera Tv-iPad.ipa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/ipad-senaste/Tv-iPad.ipa"
          gh release delete ipad-senaste --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/ipad-senaste" >/dev/null 2>&1 || true
          notes=$(printf 'Version %s, byggd från %s.\n\nPå iPaden: öppna länken i Safari, spara filen, och installera den med AltStore (Mina appar, +).\n\nDirektlänk: %s\n' "$version" "${GITHUB_SHA::7}" "$link")
          gh release create ipad-senaste dist/Tv-iPad.ipa \
            --title "Tv för iPad ${version}" \
            --notes "$notes" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
          {
            echo "## Tv för iPad ${version}"
            echo
            echo "Direktlänk: ${link}"
          } >> "$GITHUB_STEP_SUMMARY"
