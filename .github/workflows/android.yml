name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Namnge APK:n
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/norrsken-debug.apk

      # Artifacts ligger bakom inloggning och laddas ned som en zip. Bra på
      # dator, oanvändbart på en TV.
      - uses: actions/upload-artifact@v4
        with:
          name: norrsken-debug-apk
          path: dist/norrsken-debug.apk

      # Vid en tagg (git tag v0.1.0 && git push --tags) läggs APK:n som en
      # release i stället. Den får en öppen, direkt nedladdningslänk — och
      # det är den enda formen Shield kan hantera utan dator.
      - name: Publicera release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/norrsken-debug.apk --generate-notes
