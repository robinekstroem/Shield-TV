name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # gradle-version: current installerar senaste stabila Gradle och lägger
      # den på PATH. Med den behöver repot ingen wrapper för att bygga.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # Steget far aldrig falla sjalvt: da skulle bade det och
      # sammanfattningssteget nedan annoteras, och ett enda byggfel sag ut
      # som tva. Utfallet bars i stallet vidare som en output.
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          status=0
          if [ -f ./gradlew ]; then
            # Committad från Windows saknar gradlew ofta körbiten.
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || status=$?
          else
            echo "::notice::Ingen Gradle wrapper i repot - bygger med installerad Gradle."
            gradle assembleDebug --stacktrace 2>&1 | tee build.log || status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Lyfter upp felet till sammanfattningssidan, så det går att läsa och
      # skärmdumpa på en telefon i stället för att scrolla i råloggen.
      - name: Visa felet i sammanfattningen
        if: steps.build.outputs.status != '0'
        run: |
          # Kotlins kompileringsfel skrivs med prefixet "e:" LANGT FORE
          # FAILURE-blocket. Tog man bara FAILURE och framat fick man
          # stacktracen fran Gradle, som inte sager vilken rad som ar fel.
          KOTLIN=$(grep -E '^e: ' build.log | head -n 40)
          WHAT=$(sed -n '/\* What went wrong:/,/\* Try:/p' build.log | head -n 25)
          {
            echo '## Byggfel'
            echo ''
            if [ -n "$KOTLIN" ]; then
              echo '### Kompileringsfel'
              echo '```'
              printf '%s\n' "$KOTLIN"
              echo '```'
            fi
            if [ -n "$WHAT" ]; then
              echo '### Gradle'
              echo '```'
              printf '%s\n' "$WHAT"
              echo '```'
            fi
            if [ -z "$KOTLIN$WHAT" ]; then
              echo 'Inga e:-rader och inget What-went-wrong-block. Sista raderna:'
              echo '```'
              tail -n 80 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Namnge APK:n
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/norrsken-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: norrsken-debug-apk
          path: dist/norrsken-debug.apk

      # Vid en tagg (git tag v0.1.0 && git push --tags) laggs APK:n som en
      # release med en oppen direktlank som Downloader kan hamta.
      - name: Publicera release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/norrsken-debug.apk --generate-notes
