name: Build Shield

# Shield-appen (Android TV). Bygger en APK och lägger den under Releases som
# "Tv för Shield", med en fast direktlänk som Downloader på Shield kan hämta.
#
# Körs när Shield-koden (med sin låsta kopia av Windows-koden) eller koden
# som delas med telefonappen ändras. Går också att starta för hand: Actions →
# Build Shield → Run workflow.
on:
  push:
    branches: [ main ]
    paths:
      - 'shield/**'
      - '.github/workflows/shield.yml'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/M3uParser.kt'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/SourceDetection.kt'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/ImportState.kt'
      - 'app/src/main/java/se/norrsken/tv/data/remote/PlaylistDownloader.kt'
      - 'app/src/main/java/se/norrsken/tv/data/xtream/XtreamClient.kt'
      - 'app/src/main/java/se/norrsken/tv/data/xtream/XtreamModels.kt'
      - 'app/src/main/java/se/norrsken/tv/data/security/UrlSanitizer.kt'
  workflow_dispatch:

permissions:
  contents: write

# Två pushar tätt efter varandra: den senaste vinner.
concurrency:
  group: build-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Bygg Shield-appen
        id: build
        working-directory: shield
        run: |
          set -o pipefail
          status=0
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Felet ska gå att läsa utan att gräva i tusen rader logg.
      - name: Sammanfatta felet
        if: steps.build.outputs.status != '0'
        working-directory: shield
        run: |
          KOTLIN=$(grep -E '^e: ' build.log | head -n 40)
          WHAT=$(sed -n '/\* What went wrong:/,/\* Try:/p' build.log | head -n 25)
          {
            echo '## Shield-bygget misslyckades'
            echo ''
            echo 'Kopiera allt i rutan nedan och klistra in det i chatten.'
            echo ''
            echo '```'
            if [ -n "$KOTLIN" ]; then printf '%s\n' "$KOTLIN"; fi
            if [ -n "$WHAT" ]; then printf '%s\n' "$WHAT"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Bygget misslyckades. Se sammanfattningen för körningen."
          exit 1

      # Fast filnamn, så att direktlänken är densamma för varje ny version.
      - name: Döp om till Tv-Shield.apk
        run: |
          mkdir -p dist
          cp shield/build/outputs/apk/debug/*.apk dist/Tv-Shield.apk
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: tv-shield
          path: dist/Tv-Shield.apk
          if-no-files-found: error
          retention-days: 30

      # En enda release, "shield-senaste", som byts ut vid varje bygge.
      # Förhandsversion: den blir aldrig "Latest", så telefonappens releaser
      # och direktlänkar påverkas inte.
      - name: Publicera Tv-Shield.apk
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/shield-senaste/Tv-Shield.apk"
          gh release delete shield-senaste --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/shield-senaste" >/dev/null 2>&1 || true
          notes=$(printf 'Version %s, byggd från %s.\n\nPå Shield: öppna Downloader och skriv in direktlänken.\nEn ny version installeras ovanpå den gamla. Källor och bibliotek ligger kvar.\n\nDirektlänk: %s\n' "$version" "${GITHUB_SHA::7}" "$link")
          gh release create shield-senaste dist/Tv-Shield.apk \
            --title "Tv för Shield ${version}" \
            --notes "$notes" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
          {
            echo "## Tv för Shield ${version}"
            echo
            echo "Direktlänk för Downloader: ${link}"
          } >> "$GITHUB_STEP_SUMMARY"
