name: Build Shield

# Shield-appen (Android TV). Bygger en APK och lägger den som ett dolt utkast
# under Releases, "Tv för Shield". Utkast syns bara för den som äger
# projektet, så ingen annan kan ladda ner appen därifrån.
#
# Körs när Shield-koden, Windows-koden (som Shield bygger på) eller koden som
# delas med telefonappen ändras. Går också att starta för hand: Actions →
# Build Shield → Run workflow.
on:
  push:
    branches: [ main ]
    paths:
      - 'shield/**'
      - 'windows/src/**'
      - '.github/workflows/shield.yml'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/M3uParser.kt'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/SourceDetection.kt'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/ImportState.kt'
      - 'app/src/main/java/se/norrsken/tv/data/remote/PlaylistDownloader.kt'
      - 'app/src/main/java/se/norrsken/tv/data/xtream/XtreamClient.kt'
      - 'app/src/main/java/se/norrsken/tv/data/xtream/XtreamModels.kt'
      - 'app/src/main/java/se/norrsken/tv/data/security/UrlSanitizer.kt'
  workflow_dispatch:

permissions:
  contents: write

# Två pushar tätt efter varandra: den senaste vinner.
concurrency:
  group: build-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Bygg Shield-appen
        id: build
        working-directory: shield
        run: |
          set -o pipefail
          status=0
          gradle assembleRelease --stacktrace 2>&1 | tee build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Felet ska gå att läsa utan att gräva i tusen rader logg.
      - name: Sammanfatta felet
        if: steps.build.outputs.status != '0'
        working-directory: shield
        run: |
          KOTLIN=$(grep -E '^e: ' build.log | head -n 40)
          WHAT=$(sed -n '/\* What went wrong:/,/\* Try:/p' build.log | head -n 25)
          {
            echo '## Shield-bygget misslyckades'
            echo ''
            echo 'Kopiera allt i rutan nedan och klistra in det i chatten.'
            echo ''
            echo '```'
            if [ -n "$KOTLIN" ]; then printf '%s\n' "$KOTLIN"; fi
            if [ -n "$WHAT" ]; then printf '%s\n' "$WHAT"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Bygget misslyckades. Se sammanfattningen för körningen."
          exit 1

      - name: Döp om till Tv-Shield.apk
        run: |
          mkdir -p dist
          cp shield/build/outputs/apk/release/*.apk dist/Tv-Shield.apk
          ls -la dist

      # Bara en reserv om utkastet nedan skulle fallera. Byggfiler kan hämtas
      # av alla som är inloggade på GitHub, så den sparas bara ett dygn.
      - uses: actions/upload-artifact@v6
        with:
          name: tv-shield
          path: dist/Tv-Shield.apk
          if-no-files-found: error
          retention-days: 1

      # En enda release, "shield-senaste", som byts ut vid varje bygge. Den
      # läggs som utkast: utkast syns bara för den som äger projektet, så
      # ingen annan kan ladda ner appen därifrån.
      - name: Lägg Tv-Shield.apk som dolt utkast
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          # Förra utkastet bort, och en gammal publicerad release med samma tagg.
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "shield-senaste") | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" >/dev/null
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/shield-senaste" >/dev/null 2>&1 || true
          notes=$(printf 'Version %s, byggd från %s.\nEn ny version installeras ovanpå den gamla. Källor och bibliotek ligger kvar.\n' "$version" "${GITHUB_SHA::7}")
          gh release create shield-senaste dist/Tv-Shield.apk \
            --draft \
            --title "Tv för Shield ${version}" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
          echo "## Tv för Shield ${version} (dolt utkast under Releases)" >> "$GITHUB_STEP_SUMMARY"
