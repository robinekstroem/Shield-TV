name: Kontroll Windows

# Kompilerar Windows-versionen (samma kod som Mac-appen) på en vanlig
# Linux-maskin hos GitHub vid varje ändring, så att ett fel syns direkt och
# inte först när "Installera Tv" körs på datorn. Billigt: bara kompilering,
# ingen installationsfil. Mac-appen byggs för hand (Build Mac).
on:
  push:
    branches: [ main ]
    paths:
      - 'windows/src/**'
      - 'windows/build.gradle.kts'
      - 'windows/settings.gradle.kts'
      - 'windows/gradle.properties'
      - '.github/workflows/windows-check.yml'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/M3uParser.kt'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/SourceDetection.kt'
      - 'app/src/main/java/se/norrsken/tv/data/playlist/ImportState.kt'
      - 'app/src/main/java/se/norrsken/tv/data/remote/PlaylistDownloader.kt'
      - 'app/src/main/java/se/norrsken/tv/data/xtream/XtreamClient.kt'
      - 'app/src/main/java/se/norrsken/tv/data/xtream/XtreamModels.kt'
      - 'app/src/main/java/se/norrsken/tv/data/security/UrlSanitizer.kt'
  workflow_dispatch:

permissions:
  # Förhandsbilderna läggs som ett dolt utkast under Releases.
  contents: write

# Två pushar tätt efter varandra: den senaste vinner.
concurrency:
  group: check-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Kompilera
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Kompilera Windows-koden
        id: build
        working-directory: windows
        run: |
          set -o pipefail
          status=0
          gradle compileKotlin --stacktrace 2>&1 | tee build.log || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Förhandsbilder: appen ritad som på tv:n, till bilder att granska innan
      # något byggs till Shield. Ett fel här stoppar inte kontrollen.
      - name: Typsnitt för förhandsbilderna
        if: steps.build.outputs.status == '0'
        continue-on-error: true
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq fonts-roboto fonts-noto-color-emoji >/dev/null 2>&1 || true
          # Compose väljer på Linux Noto Sans eller DejaVu Sans före allt annat. Utan
          # dem blir texten Roboto, som på Shield.
          sudo find /usr/share/fonts -iname 'DejaVuSans*.ttf' ! -iname '*Mono*' -delete 2>/dev/null || true
          sudo find /usr/share/fonts -iname 'NotoSans-*.ttf' -delete 2>/dev/null || true
          mkdir -p ~/.config/fontconfig
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' \
            '<alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>' \
            '</fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null 2>&1 || true

      # Brasan, prov: filmer av brasor med fri licens från Wikimedia Commons och
      # några bilder ur dem, till förhandsbilderna. Tas bort när brasan är vald.
      - name: Brasan, provfilmer
        if: steps.build.outputs.status == '0' && hashFiles('windows/verktyg/brasa-prov.py') != ''
        continue-on-error: true
        timeout-minutes: 10
        run: |
          command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          python3 windows/verktyg/brasa-prov.py windows/build/previews/brasa

      - name: Rita förhandsbilder
        if: steps.build.outputs.status == '0'
        continue-on-error: true
        timeout-minutes: 12
        working-directory: windows
        run: gradle renderPreviews --stacktrace 2>&1 | grep -v '^\s*at org.gradle' | tail -n 120

      # Som ett dolt utkast under Releases ("forhandsbilder"), som byts ut vid
      # varje körning. Utkast syns bara för den som äger projektet.
      - name: Lägg förhandsbilderna som dolt utkast
        if: steps.build.outputs.status == '0' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls windows/build/previews/*.png >/dev/null 2>&1 || exit 0
          (cd windows/build/previews && zip -q -r ../forhandsbilder.zip .)
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "forhandsbilder") | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" >/dev/null
          done
          gh release create forhandsbilder windows/build/forhandsbilder.zip \
            --draft \
            --title "Förhandsbilder ${GITHUB_SHA::7}" \
            --notes "Appen ritad som på tv:n, från ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"

      # Felet ska gå att läsa utan att gräva i tusen rader logg.
      - name: Sammanfatta felet
        if: steps.build.outputs.status != '0'
        working-directory: windows
        run: |
          KOTLIN=$(grep -E '^e: ' build.log | head -n 40)
          WHAT=$(sed -n '/\* What went wrong:/,/\* Try:/p' build.log | head -n 25)
          {
            echo '## Windows-koden gick inte att kompilera'
            echo ''
            echo 'Kopiera allt i rutan nedan och klistra in det i chatten.'
            echo ''
            echo '```'
            if [ -n "$KOTLIN" ]; then printf '%s\n' "$KOTLIN"; fi
            if [ -n "$WHAT" ]; then printf '%s\n' "$WHAT"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Kompileringen misslyckades. Se sammanfattningen för körningen."
          exit 1
